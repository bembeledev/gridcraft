[package]
name = "gridcraft-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft co-editing (plugin protocol 2): the workbook as a Yjs document (schema 1), end-to-end encryption, awareness"

[lints]
workspace = true

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
yrs = { version = "0.28", features = ["sync"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

# The browser's crypto.getRandomValues (the web build's client ids and room keys).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
