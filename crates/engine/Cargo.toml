[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-pdf = { workspace = true }
image = { workspace = true }
# Grapheme clusters, so printed stacked-vertical text (`textRotation="255"`) breaks between whole
# characters, not inside a combining mark or an emoji sequence. Already in the tree (ui-egui);
# this promotes it to a direct engine dependency. Pure Rust, wasm-safe.
unicode-segmentation = { workspace = true }

[dev-dependencies]
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
