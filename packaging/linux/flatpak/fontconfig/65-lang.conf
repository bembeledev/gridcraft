<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- East and Southeast Asian language ordering for GridCraft's Flatpak build, written after
     the fontconfig setup on the development machine (Fedora's 65-0-google-noto-*-vf.conf):
     for these languages, prepend the matching Noto face to the generic family.

     CJK (zh, ja, ko and the Chinese topolects) is handled by 70-noto-cjk.conf. No font is
     bundled: the faces come from the runtime or the host (/run/host/fonts), and when none is
     installed every rule matches nothing and the previous match stands. -->
<fontconfig>
  <!-- Latin-script East and Southeast Asian languages: fil, id, jv, ms, su, tl, vi, mn-mn -->
  <match target="pattern">
    <or>
      <test name="lang"><string>fil</string></test>
      <test name="lang"><string>id</string></test>
      <test name="lang"><string>jv</string></test>
      <test name="lang"><string>ms</string></test>
      <test name="lang"><string>su</string></test>
      <test name="lang"><string>tl</string></test>
      <test name="lang"><string>vi</string></test>
      <test name="lang"><string>mn-mn</string></test>
    </or>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <or>
      <test name="lang"><string>fil</string></test>
      <test name="lang"><string>id</string></test>
      <test name="lang"><string>jv</string></test>
      <test name="lang"><string>ms</string></test>
      <test name="lang"><string>su</string></test>
      <test name="lang"><string>tl</string></test>
      <test name="lang"><string>vi</string></test>
      <test name="lang"><string>mn-mn</string></test>
    </or>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif</string></edit>
  </match>

  <!-- Thai -->
  <match target="pattern">
    <test name="lang"><string>th</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Thai</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>th</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif Thai</string></edit>
  </match>

  <!-- Lao -->
  <match target="pattern">
    <test name="lang"><string>lo</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Lao</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>lo</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif Lao</string></edit>
  </match>

  <!-- Yi -->
  <match target="pattern">
    <test name="lang"><string>ii</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Yi</string></edit>
  </match>

  <!-- Uyghur (Arabic script) -->
  <match target="pattern">
    <test name="lang"><string>ug</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ug</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Naskh Arabic</string></edit>
  </match>

  <!-- Magahi -->
  <match target="pattern">
    <test name="lang"><string>mag</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Droid Sans Devanagari</string></edit>
  </match>

  <!-- Khmer serif; the sans-serif face is already first inside the sandbox. -->
  <match target="pattern">
    <test name="lang"><string>km</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif Khmer</string></edit>
  </match>
</fontconfig>
