<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CJK face ordering for GridCraft's Flatpak build, written after the fontconfig setup on
     the development machine (Fedora's 65-0-google-noto-*-cjk-*.conf): for a CJK language,
     prepend that language's Noto CJK face to the generic family, then register the face as a
     default member of the family so asking for it by name still falls back sensibly.

     No font is bundled. The faces come from the runtime or from the host (/run/host/fonts);
     when none is installed every rule matches nothing and the previous match stands. -->
<fontconfig>
  <!-- Simplified Chinese: zh-cn, zh-sg -->
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-cn</string></test>
      <test name="lang"><string>zh-sg</string></test>
    </or>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-cn</string></test>
      <test name="lang"><string>zh-sg</string></test>
    </or>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-cn</string></test>
      <test name="lang"><string>zh-sg</string></test>
    </or>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- Traditional Chinese: zh-tw, cmn, hak, lzh, nan -->
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-tw</string></test>
      <test name="lang"><string>cmn</string></test>
      <test name="lang"><string>hak</string></test>
      <test name="lang"><string>lzh</string></test>
      <test name="lang"><string>nan</string></test>
    </or>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-tw</string></test>
      <test name="lang"><string>cmn</string></test>
      <test name="lang"><string>hak</string></test>
      <test name="lang"><string>lzh</string></test>
      <test name="lang"><string>nan</string></test>
    </or>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-tw</string></test>
      <test name="lang"><string>cmn</string></test>
      <test name="lang"><string>hak</string></test>
      <test name="lang"><string>lzh</string></test>
      <test name="lang"><string>nan</string></test>
    </or>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono CJK TC</string></edit>
  </match>

  <!-- Hong Kong Chinese: zh-hk, zh-mo, yue -->
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-hk</string></test>
      <test name="lang"><string>zh-mo</string></test>
      <test name="lang"><string>yue</string></test>
    </or>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-hk</string></test>
      <test name="lang"><string>zh-mo</string></test>
      <test name="lang"><string>yue</string></test>
    </or>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <or>
      <test name="lang"><string>zh-hk</string></test>
      <test name="lang"><string>zh-mo</string></test>
      <test name="lang"><string>yue</string></test>
    </or>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

  <!-- Japanese -->
  <match target="pattern">
    <test name="lang"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <!-- Korean -->
  <match target="pattern">
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono CJK KR</string></edit>
  </match>

  <!-- Default membership, as in Fedora's files: a missing face falls back to its generic. -->
  <alias><family>Noto Sans CJK SC</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK TC</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK HK</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK JP</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Sans CJK KR</family><default><family>sans-serif</family></default></alias>
  <alias><family>Noto Serif CJK SC</family><default><family>serif</family></default></alias>
  <alias><family>Noto Serif CJK TC</family><default><family>serif</family></default></alias>
  <alias><family>Noto Serif CJK HK</family><default><family>serif</family></default></alias>
  <alias><family>Noto Serif CJK JP</family><default><family>serif</family></default></alias>
  <alias><family>Noto Serif CJK KR</family><default><family>serif</family></default></alias>
  <alias><family>Noto Sans Mono CJK SC</family><default><family>monospace</family></default></alias>
  <alias><family>Noto Sans Mono CJK TC</family><default><family>monospace</family></default></alias>
  <alias><family>Noto Sans Mono CJK HK</family><default><family>monospace</family></default></alias>
  <alias><family>Noto Sans Mono CJK JP</family><default><family>monospace</family></default></alias>
  <alias><family>Noto Sans Mono CJK KR</family><default><family>monospace</family></default></alias>
</fontconfig>
