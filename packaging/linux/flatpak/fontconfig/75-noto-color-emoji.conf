<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The runtime's own 45-generic.conf / 60-generic.conf already define the `emoji` generic
     family and prefer Noto Color Emoji (the runtime ships it at
     /usr/share/fonts/noto-emoji). Defining it again here would be redundant, so this file
     only appends the color face to the text families, where a mixed text+emoji run needs it.
     A missing face is ignored. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
