<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- GridCraft application font configuration.
     The runtime's /etc/fonts/conf.d/50-flatpak.conf includes this file; it in turn loads the
     snippets installed in /app. This mirrors the include chain in the host's fonts.conf. -->
<fontconfig>
  <include ignore_missing="yes">/app/etc/fonts/conf.d/</include>
</fontconfig>
